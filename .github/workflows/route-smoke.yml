name: Route smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  preview:
    name: Chromium route smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:route-smoke
