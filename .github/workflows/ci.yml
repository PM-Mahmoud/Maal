name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Deterministic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm test

  postgres-migrations:
    name: PostgreSQL migrations (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: pgvector
            image: pgvector/pgvector:0.8.7-pg17-bookworm
            vector: 'true'
          - variant: plain
            image: postgres:17-bookworm
            vector: 'false'
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: maal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d maal_test"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/maal_test
      PGPASSWORD: local-test-only
      EXPECT_PGVECTOR: ${{ matrix.vector }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Run migrations twice
        run: |
          node migrate.js
          node migrate.js
      - name: Verify the expected knowledge schema
        run: |
          node <<'JS'
          const assert = require('node:assert/strict');
          const { Client } = require('pg');

          async function verify() {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            try {
              await client.connect();
              const { rows: [schema] } = await client.query(`
                SELECT EXISTS (SELECT 1 FROM pg_extension WHERE extname = 'vector') AS vector,
                       EXISTS (
                         SELECT 1 FROM pg_attribute
                         WHERE attrelid = 'knowledge_chunks'::regclass
                           AND attname = 'embedding'
                           AND NOT attisdropped
                       ) AS embedding,
                       to_regclass('knowledge_chunks_embedding_idx') IS NOT NULL AS hnsw
              `);
              const expected = process.env.EXPECT_PGVECTOR === 'true';
              assert.deepEqual(schema, { vector: expected, embedding: expected, hnsw: expected });
            } finally {
              await client.end();
            }
          }

          verify().catch((error) => {
            console.error(error.message);
            process.exitCode = 1;
          });
          JS
      # These contract tests deliberately reset public in the disposable DB.
      - run: npm run test:integrity-db
      - run: npm run test:collaboration-db
      - run: npm run test:lunchflow-db

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - run: BASE_REF="${{ steps.base.outputs.ref }}" bash scripts/ci-secret-scan.sh

  migration-guard:
    name: Protected migration guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Determine base ref
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - run: BASE_REF="${{ steps.base.outputs.ref }}" node scripts/ci-migration-guard.js

  eval:
    name: Advisor content evals
    runs-on: ubuntu-latest
    # Soft-gated on secrets being configured — see evals/advisor-education.md.
    # Add AZURE_OPENAI_ENDPOINT/_API_KEY/_DEPLOYMENT (or GROQ_API_KEY) as repo
    # secrets to activate this as a real merge gate; until then it runs but
    # evals/run-evals.js soft-skips with exit 0.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run eval
        env:
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
