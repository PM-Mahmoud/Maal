    <!-- Theme before first paint (no flash). Mirrors src/lib/theme.ts: maal-theme = light | dark | system (default). -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('maal-theme');
          var dark = p === 'dark' || (p !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.setAttribute('data-theme', dark ? 'dark' : 'light');
          if (dark) el.classList.add('dark');
          el.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
