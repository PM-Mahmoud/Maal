# Operator draft. Compare the scheduler cadence with the current jobs before use.
name: maal-sydney
region: syd

envs:
  - key: NODE_ENV
    scope: RUN_TIME
    value: production

ingress:
  rules:
    - match:
        path:
          prefix: /
      component:
        name: web

services:
  - name: web
    github:
      repo: PM-Mahmoud/Maal
      branch: main
      deploy_on_push: false
    environment_slug: node-js
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SESSION_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: BASE_URL
        scope: RUN_TIME
        value: https://www.hellomaal.com
      - key: RADAR_CRON_SECRET
        scope: RUN_TIME
        type: SECRET
    source_dir: /
    build_command: npm ci --ignore-scripts && npm --prefix client ci --ignore-scripts && npm --prefix client run build
    run_command: npm start
    http_port: 8080
    health_check:
      http_path: /health

workers:
  - name: import-worker
    github:
      repo: PM-Mahmoud/Maal
      branch: main
      deploy_on_push: false
    environment_slug: node-js
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
    source_dir: /
    build_command: npm ci --ignore-scripts
    run_command: npm run worker

jobs:
  - name: migrate
    kind: PRE_DEPLOY
    github:
      repo: PM-Mahmoud/Maal
      branch: main
      deploy_on_push: false
    environment_slug: node-js
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
    source_dir: /
    build_command: npm ci --ignore-scripts
    run_command: npm run migrate
  - name: radar
    kind: SCHEDULED
    schedule:
      cron: "*/15 * * * *"
      time_zone: Etc/UTC
    github:
      repo: PM-Mahmoud/Maal
      branch: main
      deploy_on_push: false
    environment_slug: node-js
    envs:
      - key: RADAR_CRON_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SCHEDULER_BASE_URL
        scope: RUN_TIME
        value: https://www.hellomaal.com
    source_dir: /
    build_command: npm ci --ignore-scripts
    run_command: >-
      node -e 'fetch(new URL("/internal/radar/run",process.env.SCHEDULER_BASE_URL),
      {headers:{Authorization:"Bearer "+process.env.RADAR_CRON_SECRET},signal:AbortSignal.timeout(120_000)})
      .then(r=>{if(!r.ok){console.error("Radar job status",r.status);process.exitCode=1}})
      .catch(()=>{console.error("Radar job request failed");process.exitCode=1})'
  - name: constants-drift
    kind: SCHEDULED
    schedule:
      cron: "0 0 1 * *"
      time_zone: Etc/UTC
    github:
      repo: PM-Mahmoud/Maal
      branch: main
      deploy_on_push: false
    environment_slug: node-js
    envs:
      - key: RADAR_CRON_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: SCHEDULER_BASE_URL
        scope: RUN_TIME
        value: https://www.hellomaal.com
    source_dir: /
    build_command: npm ci --ignore-scripts
    run_command: >-
      node -e 'fetch(new URL("/internal/constants/drift",process.env.SCHEDULER_BASE_URL),
      {headers:{Authorization:"Bearer "+process.env.RADAR_CRON_SECRET},signal:AbortSignal.timeout(120_000)})
      .then(r=>{if(!r.ok){console.error("Constants drift job status",r.status);process.exitCode=1}})
      .catch(()=>{console.error("Constants drift job request failed");process.exitCode=1})'
